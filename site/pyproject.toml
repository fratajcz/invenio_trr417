[project]
name = "trr417-inventory"
version = "0.1.0"
description = "Add your description here"
requires-python = ">= 3.14"

[project.entry-points."invenio_base.blueprints"]
trr417_inventory_views = "trr417_inventory.views:create_blueprint"

[project.entry-points."invenio_assets.webpack"]
trr417_inventory_theme = "trr417_inventory.webpack:theme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trr417_inventory"]

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = ["D401", "D403"]

[tool.pytest.ini_options]
addopts = ["--isort", "--pydocstyle", "--doctest-glob=\"*.rst\"", "--doctest-modules", "--cov=trr417_inventory", "--cov-report=term-missing", "--exclude-warning-annotations"]
testpaths = "tests trr417_inventory"
live_server_scope = "module"
